[project]
name = "relationship-assistant"
version = "0.3.0"
description = "WhatsApp-first, permission-aware communication assistant backend"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn[standard]>=0.34,<1", "sqlalchemy>=2.0.36,<3",
  "alembic>=1.14,<2", "psycopg[binary]>=3.2,<4", "pydantic-settings>=2.7,<3",
  "cryptography>=50,<51", "google-auth>=2.37,<3", "requests>=2.32,<3",
  "httpx>=0.28,<1", "python-multipart>=0.0.20,<1", "temporalio>=1.9,<2",
  "aiokafka>=0.12,<1", "redis>=5.2,<7",
]

[dependency-groups]
dev = ["pytest>=8.3,<10", "pytest-cov>=6,<8", "ruff>=0.11,<1"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["services/api/assistant"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["services/api"]

[tool.ruff]
target-version = "py312"
line-length = 110

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
