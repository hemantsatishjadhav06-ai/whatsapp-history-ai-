name: Backend
on:
  push:
    branches-ignore: [main]
  pull_request:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: backend-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

defaults:
  run:
    shell: bash

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          version: "0.12.19"
          enable-cache: true
      - run: uv python install 3.12.14
      - run: uv sync --frozen --group dev
      - run: uv run --frozen ruff check services tests scripts
      - name: SQLite regression suite
        run: |
          mkdir -p .local/ci-evidence
          uv run --frozen pytest -q --junitxml=.local/ci-evidence/sqlite.xml | tee .local/ci-evidence/sqlite.log
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24.19.0"
          cache: npm
          cache-dependency-path: services/connector-gateway/package-lock.json
      - run: npm ci --prefix services/connector-gateway --ignore-scripts
      - run: npm --prefix services/connector-gateway run check
      - name: Private QR session service and dependency audit
        run: |
          npm ci --prefix services/whatsapp-session --ignore-scripts
          npm --prefix services/whatsapp-session run check
          npm --prefix services/whatsapp-session audit --omit=dev --audit-level=high
      - name: Verify shared API contracts and authenticated mock bridge
        run: |
          uv run --frozen python scripts/export_contracts.py
          git diff --exit-code -- packages/contracts
          uv run --frozen python scripts/bridge_smoke.py
      - name: Verify repeatable migrations and model alignment
        env:
          DATABASE_URL: sqlite:///.local/ci-migrations.db
          ENVIRONMENT: test
        run: |
          mkdir -p .local
          uv run --frozen alembic upgrade head
          uv run --frozen alembic upgrade head
          uv run --frozen alembic check
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: backend-sqlite-${{ github.sha }}
          path: .local/ci-evidence/
          if-no-files-found: ignore
          retention-days: 14

  postgres:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: milo_test
          POSTGRES_USER: postgres
          # Disposable CI database only; never a deployment credential.
          POSTGRES_PASSWORD: milo-ci-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7.4.2-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql+psycopg://postgres:milo-ci-only@localhost:5432/milo_test
      ENVIRONMENT: test
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          version: "0.12.19"
          enable-cache: true
      - run: uv python install 3.12.14
      - run: uv sync --frozen --group dev
      # Includes separate-process authority, job, receipt and quota races.
      - name: Full PostgreSQL regression suite
        run: |
          mkdir -p .local/ci-evidence
          uv run --frozen pytest -q --junitxml=.local/ci-evidence/postgres.xml | tee .local/ci-evidence/postgres.log
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24.19.0"
          cache: npm
          cache-dependency-path: services/whatsapp-session/package-lock.json
      - name: Actual PostgreSQL session encryption and ownership recovery
        env:
          NODE_TEST_DATABASE_URL: postgresql://postgres:milo-ci-only@localhost:5432/milo_test
        run: |
          npm ci --prefix services/whatsapp-session --ignore-scripts
          npm --prefix services/whatsapp-session run check | tee .local/ci-evidence/qr-postgres.log
      - name: Private QR connection and approved text bridge
        run: >-
          uv run --frozen python scripts/personal_qr_bridge_smoke.py
          --output .local/ci-evidence/personal-qr-bridge.json
          | tee .local/ci-evidence/personal-qr-bridge.log
      - name: Real Redis limits and failure recovery
        run: uv run --frozen python scripts/request_limits_smoke.py | tee .local/ci-evidence/redis.log
      - name: Separate-process migration locking and worker readiness
        run: >-
          uv run --frozen python scripts/render_startup_smoke.py
          --output .local/ci-evidence/render-startup.json
          | tee .local/ci-evidence/render-startup.log
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: backend-postgres-${{ github.sha }}
          path: .local/ci-evidence/
          if-no-files-found: ignore
          retention-days: 14
